<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - Mzansi Auto Repairs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #1a3a5c, #0f2640);
            color: white;
            padding: 80px 0 60px;
            margin-top: -56px;
            padding-top: 116px !important;
            border-radius: 0 0 50px 50px;
            text-align: center;
        }

        .vehicle-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: all 0.3s ease;
        }

        .vehicle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .vehicle-card .icon {
            font-size: 3rem;
            color: #1a3a5c;
        }

        .vehicle-card .details {
            text-align: left;
            margin-top: 15px;
        }

        .vehicle-card .details span {
            display: block;
            padding: 4px 0;
            color: #6b6b6b;
        }

        .vehicle-card .details strong {
            color: #1a3a5c;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.png" alt="Mzansi Auto Repairs" height="45" class="me-2"
                    onerror="this.src='https://via.placeholder.com/45x45/1a3a5c/ffffff?text=🔧'">
                <span class="fw-bold fs-5">Mzansi Auto Repairs</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-links" id="navLinks">
                <a href="index.html">🏠 Home</a>
                <a href="services.html">🔧 Services</a>
                <a href="about.html">ℹ️ About</a>
                <a href="contact.html">📧 Contact</a>
                <a href="reviews.html">⭐ Reviews</a>
                <a href="dashboard.html" id="dashboardNav" style="display:none;">👤 Dashboard</a>
                <a href="#" id="logoutNav" class="btn-logout" onclick="logout()" style="display:none;">🚪 Logout</a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="display-4 fw-bold">🚗 My Vehicles</h1>
            <p class="lead">Manage your registered vehicles</p>
        </div>
    </section>

    <!-- Vehicles List -->
    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="mb-0">🚘 Your Registered Vehicles</h5>
                <a href="add-vehicle.html" class="btn btn-primary">➕ Add Vehicle</a>
            </div>
            <div class="row g-4" id="vehiclesList">
                <!-- Vehicles loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="text-muted small mb-0">© 2026 Mzansi Auto Repairs. All rights reserved. 🇿🇦</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/vehicles.js"></script>
</body>

</html>
