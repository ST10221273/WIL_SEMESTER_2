<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle - Mzansi Auto Repairs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #1a3a5c, #0f2640);
            color: white;
            padding: 80px 0 60px;
            margin-top: -56px;
            padding-top: 116px !important;
            border-radius: 0 0 50px 50px;
            text-align: center;
        }
        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 600px;
            margin: 0 auto;
        }
        .form-card .form-control { border-radius: 8px; padding: 12px 16px; }
        .form-card .form-control:focus { border-color: #d4a843; box-shadow: 0 0 0 3px rgba(212,168,67,0.2); }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.png" alt="Mzansi Auto Repairs" height="45" class="me-2"
                     onerror="this.src='https://via.placeholder.com/45x45/1a3a5c/ffffff?text=🔧'">
                <span class="fw-bold fs-5">Mzansi Auto Repairs</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">🔧 Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">ℹ️ About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">📧 Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="reviews.html">⭐ Reviews</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-warning text-dark px-3 ms-2" href="login.html">🔑 Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="display-4 fw-bold">🚗 Add Vehicle</h1>
            <p class="lead">Add your vehicle details to manage services</p>
        </div>
    </section>

    <!-- Form -->
    <section class="py-5">
        <div class="container">
            <div class="form-card">
                <form id="addVehicleForm" onsubmit="addVehicle(event)">
                    <div class="mb-3">
                        <label class="fw-bold">🏭 Make</label>
                        <input type="text" id="vehicleMake" class="form-control" placeholder="e.g., Toyota, BMW, Ford" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold">🚘 Model</label>
                        <input type="text" id="vehicleModel" class="form-control" placeholder="e.g., Corolla, X5, Ranger" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold">📅 Year</label>
                        <input type="number" id="vehicleYear" class="form-control" placeholder="e.g., 2020" min="1980" max="2026" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold">🔢 License Plate</label>
                        <input type="text" id="vehiclePlate" class="form-control" placeholder="e.g., CA 123-45" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold">🎨 Color</label>
                        <input type="text" id="vehicleColor" class="form-control" placeholder="e.g., Red, Blue, White">
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold">📊 Mileage (km)</label>
                        <input type="number" id="vehicleMileage" class="form-control" placeholder="e.g., 50000">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">✅ Add Vehicle</button>
                </form>
                <div class="text-center mt-3">
                    <a href="vehicles.html" class="text-decoration-none text-muted">← Back to Vehicles</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="text-muted small mb-0">© 2026 Mzansi Auto Repairs. All rights reserved. 🇿🇦</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/add-vehicle.js"></script>
</body>
</html>
