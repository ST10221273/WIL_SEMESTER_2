<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Messages - Mzansi Auto Repairs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #1a3a5c, #0f2640);
            color: white;
            padding: 80px 0 60px;
            margin-top: -56px;
            padding-top: 116px !important;
            border-radius: 0 0 50px 50px;
            text-align: center;
        }
        .message-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .message-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .message-card.unread { border-left-color: #f39c12; }
        .message-card .header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            flex-wrap: wrap;
        }
        .message-card .subject { font-weight: 600; color: #1a3a5c; }
        .message-card .new-badge {
            background: #f39c12;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .message-card .date { color: #999; font-size: 0.85rem; }
        .message-card .body { margin: 10px 0; color: #6b6b6b; }
        .message-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #999;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.png" alt="Mzansi Auto Repairs" height="45" class="me-2"
                     onerror="this.src='https://via.placeholder.com/45x45/1a3a5c/ffffff?text=🔧'">
                <span class="fw-bold fs-5">Mzansi Auto Repairs</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">🔧 Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">ℹ️ About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">📧 Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="reviews.html">⭐ Reviews</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-warning text-dark px-3 ms-2" href="login.html">🔑 Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="display-4 fw-bold">📧 My Messages</h1>
            <p class="lead">View your enquiries and responses</p>
        </div>
    </section>

    <!-- Messages List -->
    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="mb-0">💬 Your Messages</h5>
                <a href="contact.html" class="btn btn-primary">✉️ New Message</a>
            </div>
            <div id="messagesList">
                <!-- Messages loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="text-muted small mb-0">© 2026 Mzansi Auto Repairs. All rights reserved. 🇿🇦</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
